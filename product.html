<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>מוצר | Print3D</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        Print<span>3D</span>
    </div>

    <nav>
        <a href="index.html">בית</a>
        <a href="index.html#products">מוצרים</a>
    </nav>

    <button id="cartButton" class="cart-button">
        🛒 עגלה <b id="cartCount">0</b>
    </button>

</header>


<main class="product-page-container">

    <a href="index.html#products" class="back">
        ← חזרה למוצרים
    </a>

    <div id="productDetails"></div>

</main>


<div id="overlay"></div>


<aside id="cart">

    <div class="cart-header">

        <h2>🛒 העגלה</h2>

        <button id="closeCart">✕</button>

    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-bottom">

        <div class="tip-row">

            <span>💝 טיפ</span>

            <select id="tipSelect">
                <option value="0">ללא טיפ</option>
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
            </select>

        </div>

        <div class="coupon">

            <input
                id="couponInput"
                type="text"
                inputmode="numeric"
                maxlength="10"
                placeholder="קוד קופון"
            >

            <button id="couponButton">
                הפעל
            </button>

        </div>

        <div id="couponMessage"></div>

        <div class="summary">

            <div>
                <span>מחיר מוצרים</span>
                <span>₪<b id="subtotal">0</b></span>
            </div>

            <div>
                <span>הנחה</span>
                <span>₪<b id="discount">0</b></span>
            </div>

            <div>
                <span>טיפ</span>
                <span>₪<b id="tipAmount">0</b></span>
            </div>

            <div class="total">
                <span>סה״כ</span>
                <span>₪<b id="total">0</b></span>
            </div>

        </div>

        <button id="checkoutButton" class="checkout-button">
            המשך להזמנה
        </button>

    </div>

</aside>


<script src="script.js"></script>

</body>
</html>
