</aside>

const whatsappNumber = "972509996873";

const coupons = {
    "5839210476": 100
};

let cart = [];
let appliedCoupon = null;


function getProduct(id) {
    return products.find(product => product.id === id);
}


function getProductsTotal() {
    return cart.reduce(
        (sum, product) => sum + product.price,
        0
    );
}


function getTipPercent() {
    return Number(
        document.getElementById("cartTip").value
    );
}


function getTipAmount() {
    return Math.round(
        getProductsTotal() *
        getTipPercent() /
        100
    );
}


function getCouponDiscount() {

    if (!appliedCoupon) {
        return 0;
    }

    return Math.round(
        getProductsTotal() *
        appliedCoupon.discount /
        100
    );
}


function updateCart() {

    const items = document.getElementById("cartItems");

    document.getElementById("cartCount").textContent =
        cart.length;


    if (cart.length === 0) {

        items.innerHTML = `
            <div class="empty-cart">
                🛒
                <br><br>
                העגלה שלך ריקה
            </div>
        `;

    } else {

        items.innerHTML = "";

        cart.forEach((product, index) => {

            const row =
                document.createElement("div");

            row.className = "cart-item";

            row.innerHTML = `
                <img
                    src="${product.image}"
                    class="cart-item-image"
                    alt="${product.name}"
                >

                <div class="cart-item-info">
                    <strong>${product.name}</strong>
                    <div>₪${product.price}</div>
                </div>

                <button class="remove-button">
                    ✕
                </button>
            `;

            row.querySelector(
                ".remove-button"
            ).addEventListener(
                "click",
                () => {
                    cart.splice(index, 1);
                    updateCart();
                }
            );

            items.appendChild(row);
        });
    }


    const subtotal = getProductsTotal();

    const discount = getCouponDiscount();

    const tip = getTipAmount();

    const total = Math.max(
        0,
        subtotal - discount + tip
    );


    document.getElementById(
        "productsTotal"
    ).textContent = subtotal;


    document.getElementById(
        "couponDiscount"
    ).textContent = discount;


    document.getElementById(
        "tipTotal"
    ).textContent = tip;


    document.getElementById(
        "cartTotal"
    ).textContent = total;
}


function openCart() {

    document
        .getElementById("cart")
        .classList.add("open");

    document
        .getElementById("cartOverlay")
        .classList.add("show");
}


function closeCart() {

    document
        .getElementById("cart")
        .classList.remove("open");

    document
        .getElementById("cartOverlay")
        .classList.remove("show");
}


function addToCart(id) {

    const product = getProduct(id);

    if (!product) {
        return;
    }

    cart.push(product);

    updateCart();

    openCart();
}


function applyCoupon() {

    const code =
        document
            .getElementById("couponInput")
            .value
            .trim();

    const message =
        document.getElementById(
            "couponMessage"
        );


    if (coupons[code] !== undefined) {

        appliedCoupon = {
            code: code,
            discount: coupons[code]
        };

        message.textContent =
            `✅ הקופון הופעל! ${coupons[code]}% הנחה`;

    } else {

        appliedCoupon = null;

        message.textContent =
            "❌ קוד קופון לא תקין";
    }

    updateCart();
}


function createOrderText() {

    let text =
        "שלום! אני רוצה להזמין:\n\n";


    cart.forEach(product => {

        text +=
            `• ${product.name} - ₪${product.price}\n`;

    });


    const subtotal =
        getProductsTotal();

    const discount =
        getCouponDiscount();

    const tip =
        getTipAmount();


    const total =
        Math.max(
            0,
            subtotal - discount + tip
        );


    text +=
        `\n💵 מחיר מוצרים: ₪${subtotal}`;


    if (appliedCoupon) {

        text +=
            `\n🎟️ קופון: ${appliedCoupon.code}` +
            `\n💸 הנחה: -₪${discount}`;

    }


    if (tip > 0) {

        text +=
            `\n💝 טיפ: ₪${tip}`;

    }


    text +=
        `\n\n💰 סה״כ: ₪${total}`;


    return text;
}


function checkout() {

    if (cart.length === 0) {

        alert("העגלה שלך ריקה 🛒");

        return;
    }


    const messageBox =
        document.getElementById(
            "customerMessage"
        );


    if (messageBox) {

        messageBox.value =
            createOrderText();

    }


    closeCart();


    window.location.href =
        "index.html#contact";
}


// עמוד מוצר

const params =
    new URLSearchParams(
        window.location.search
    );


const productId =
    Number(
        params.get("id")
    );


const product =
    getProduct(productId);


const details =
    document.getElementById(
        "productDetails"
    );


if (product && details) {

    document.title =
        product.name + " | Print3D";


    details.innerHTML = `

        <div class="product-page">

            <div class="product-page-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

            </div>


            <div class="product-page-info">

                <div class="small-title">
                    PRINT3D
                </div>

                <h1>
                    ${product.name}
                </h1>

                <div class="product-page-price">
                    ₪${product.price}
                </div>

                <p>
                    ${product.description}
                </p>

                <button
                    class="add-button large"
                    id="productAddButton"
                >
                    🛒 הוסף לעגלה
                </button>

            </div>

        </div>
    `;


    document
        .getElementById(
            "productAddButton"
        )
        .addEventListener(
            "click",
            () => addToCart(product.id)
        );

} else if (details) {

    details.innerHTML = `
        <div class="no-products">
            😕 המוצר לא נמצא
        </div>
    `;
}


document
    .getElementById(
        "openCartButton"
    )
    .addEventListener(
        "click",
        openCart
    );


document
    .getElementById(
        "closeCartButton"
    )
    .addEventListener(
        "click",
        closeCart
    );


document
    .getElementById(
        "cartOverlay"
    )
    .addEventListener(
        "click",
        closeCart
    );


document
    .getElementById(
        "checkoutButton"
    )
    .addEventListener(
        "click",
        checkout
    );


document
    .getElementById(
        "couponButton"
    )
    .addEventListener(
        "click",
        applyCoupon
    );


document
    .getElementById(
        "cartTip"
    )
    .addEventListener(
        "change",
        updateCart
    );


updateCart();
</script>
