<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>מוצר | Print3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        Print<span>3D</span>
    </a>

    <nav>
        <a href="index.html">בית</a>
        <a href="index.html#products">מוצרים</a>
    </nav>

    <button id="openCart" class="cart-btn">
        🛒 <span id="cartCount">0</span>
    </button>

</header>


<main class="product-page">

    <a href="index.html#products" class="back">
        ← חזרה לחנות
    </a>

    <div id="productDetails"></div>

</main>


<div id="overlay"></div>


<aside id="cart">

    <div class="cart-top">

        <h2>🛒 העגלה שלי</h2>

        <button id="closeCart">✕</button>

    </div>


    <div id="cartItems" class="cart-items"></div>


    <div class="cart-bottom">

        <div class="tip-line">

            <span>💝 טיפ</span>

            <select id="tip">
                <option value="0">ללא טיפ</option>
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
            </select>

        </div>


        <div class="coupon-line">

            <input
                id="coupon"
                type="text"
                maxlength="10"
                inputmode="numeric"
                placeholder="קוד קופון"
            >

            <button id="applyCoupon">
                החל
            </button>

        </div>

        <div id="couponMessage"></div>


        <div class="prices">

            <div>
                <span>מחיר מוצרים</span>
                <strong>₪<span id="subtotal">0</span></strong>
            </div>

            <div>
                <span>הנחה</span>
                <strong>₪<span id="discount">0</span></strong>
            </div>

            <div>
                <span>טיפ</span>
                <strong>₪<span id="tipAmount">0</span></strong>
            </div>

            <div class="grand-total">
                <span>סה״כ</span>
                <strong>₪<span id="total">0</span></strong>
            </div>

        </div>


        <button id="checkout" class="checkout-btn">
            המשך להזמנה
        </button>

    </div>

</aside>


<script src="script.js"></script>

</body>
</html>
